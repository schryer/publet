jtex: v1
kind: typst
title: Bookly (local wrapper)
description: >
  Thin jtex wrapper around the @preview/bookly Typst Universe package
  (not itself a MyST template), so MyST/Curvenote can drive it the same
  way as any other jtex template -- same pattern as templates/charged-ieee
  in the docs repo, for the same reason: bookly is a plain Typst package,
  not a jtex template, and this file is what adapts it into one. See
  https://typst.app/universe/package/bookly for the underlying package's
  own docs, and https://github.com/maucejo/bookly for its source and
  real usage examples.
template: template.typ
files:
  - template.typ
version: 0.1.0
license: MIT
tags:
  - book
  - report
doc:
  - id: title
    required: true
  - id: authors
    required: true
options:
  - id: lang
    type: string
    description: Passed straight through to bookly's `lang`.
parts:
  - id: abstract
    description: >
      Rendered as front matter, ahead of the table of contents -- bookly
      has no dedicated abstract slot, so this is a reasonable place for
      one rather than an exact fit.
    required: false
