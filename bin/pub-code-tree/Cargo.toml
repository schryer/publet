[package]
name = "pub-code-tree"
description = "Parse a Rust source file into a content-addressed tree: every item, and every item nested inside it, gets its own CID."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pub-code-tree"
path = "src/main.rs"

[dependencies]
publet-core.workspace = true
graphset.workspace = true
syn = { version = "3", features = ["full", "extra-traits", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"

[lints]
workspace = true
