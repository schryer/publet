name: ci

on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Cheap, platform-independent gates. Fail fast before the matrix spends time.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No toolchain action: rust-toolchain.toml is the single source of the
      # version, and rustup honours it on the first cargo invocation.
      - run: cargo --version && rustc --version
      - run: make fmt-check
      - run: make guard-floats
      - run: make guard-deps
      - run: make lint
      - run: make doc
      - run: make guard-release

  # R8 requires bit-identical results everywhere, so determinism is verified
  # across targets rather than on one machine.
  test:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --workspace --all-features

  functional:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: the release check compares this branch with its base.
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: python -m venv .venv && .venv/bin/pip install --require-hashes -r tests/requirements.lock
      - run: make functional
      # Needs a built pub-eval, so it runs here rather than in the cheap
      # gates job. The matrix workflow checks the same digest on the other
      # three architectures.
      - run: make guard-eval
      - run: make conformance
      - run: make coverage
      - name: Fail if the conformance report drifted
        run: git diff --exit-code conformance/COVERAGE.md
      # A code change records what it changes in the package publet's
      # unreleased list; a version change must be the bump those changes
      # require, and published. See the README's "Versions and releases".
      - name: Release check
        if: github.event_name == 'pull_request'
        run: ./tools/release.py check origin/${{ github.base_ref }}

  audit:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo install --locked cargo-deny --version 0.18.6
      - run: make deny

  # On main, a version whose package publet is published, and that has no
  # tag yet, is released: tagged, with a GitHub release. CI signs nothing;
  # the release was signed when the package publet was published locally.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, functional, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: cargo build -p publet-cli
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: ./tools/release.py tag
        env:
          GH_TOKEN: ${{ github.token }}
