name: ci

on:
  push: { branches: [main] }
  pull_request:
  # Nightly: the same checks, plus longer fuzzing and the tests on the
  # latest stable and beta Rust, so new advisories and a new Rust that
  # breaks the build show up within a day.
  schedule: [{ cron: '23 3 * * *' }]
  workflow_dispatch:

jobs:
  # pubkit's shared Rust CI, with publet's own gates and checks named:
  #
  # - gates: the no-float, dependency-direction and rule guards beside fmt,
  #   clippy and docs -- cheap, so they fail fast before the matrix.
  # - test: R8 requires bit-identical results everywhere, so determinism is
  #   verified across Linux, macOS and Windows, not on one machine.
  # - functional: the Gherkin suite, then the evaluation digest (which needs
  #   a built pub-eval), the conformance scenarios, and the coverage report,
  #   which must be committed up to date.
  # - msrv: the published crates build on the oldest Rust they promise.
  # - fuzz: the decoders that read untrusted input, after replaying every
  #   input that once found a bug (fuzz/regressions/).
  # - cross: R8's bit-identical results on a 32-bit and a big-endian machine.
  ci:
    uses: schryer/pubkit/.github/workflows/rust-ci.yml@claude/ci-phase4
    with:
      gates: fmt-check guard-floats guard-deps lint doc guard-rules publish-check supply-chain-check doc-coverage-check
      test-args: --workspace --all-features
      apt-packages: jq
      functional: functional guard-eval conformance coverage-check vectors-check
      msrv: true
      fuzz: true
      cross-targets: '["i686-unknown-linux-gnu", "s390x-unknown-linux-gnu"]'
      cross-test-args: --workspace --all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: make deny
      - run: cargo install --locked cargo-vet --version 0.10.2
      - run: make vet

  # The shared release workflow: on a pull request, a code change records
  # what it changes and a release is the bump those changes require,
  # published; on main, a published version is tagged and released. CI signs
  # nothing; the release was signed when the package publet was published.
  release:
    needs: [ci, audit]
    uses: schryer/pubrel/.github/workflows/release.yml@v0.4.2
    with: { pubrel-version: v0.4.2, semver-checks-version: 0.51.0 }
    permissions:
      contents: write
