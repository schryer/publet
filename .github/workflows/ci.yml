name: ci

on:
  push: { branches: [main] }
  pull_request:
  # Nightly: the same checks, plus longer fuzzing and the tests on the
  # latest stable and beta Rust, so new advisories and a new Rust that
  # breaks the build show up within a day.
  schedule: [{ cron: '23 3 * * *' }]
  workflow_dispatch:

jobs:
  # pubkit's shared Rust CI. It runs every check the Rust crate standard
  # requires (`make required` lists them): fmt, clippy, docs, doc-coverage
  # and packaging; the tests on Linux, macOS, Windows, i686 and s390x (R8
  # requires bit-identical results everywhere); the Gherkin suite, the test
  # vectors and the supply-chain report; the oldest promised Rust; fuzzing
  # of the decoders that read untrusted input; and cargo deny and vet.
  # publet adds its own:
  #
  # - gates: the no-float, dependency-direction, rule and MSRV guards --
  #   cheap, so they fail fast before the matrix.
  # - functional: the evaluation digest (which needs a built pub-eval), the
  #   conformance scenarios, the coverage report, which must be committed
  #   up to date, and the maintainer scripts' tests, whose Cobertura report
  #   (coverage/scripts.xml) the sonar job reads. They run after `make
  #   coverage`, which empties coverage/.
  ci:
    uses: schryer/pubkit/.github/workflows/rust-ci.yml@v0.12.1
    with:
      gates: guard-floats guard-deps guard-rules guard-msrv
      test-args: --workspace --all-features
      apt-packages: jq
      functional: guard-eval conformance coverage-check script-tests
      # The Gherkin steps in tests/ are the suite, not code under test: they
      # run every scenario, but nothing measures them, so SonarQube Cloud
      # would count each line of them as uncovered.
      sonar-args: -Dsonar.coverage.exclusions=tests/**
      cross-test-args: --workspace --all-features
    secrets: inherit

  # The shared release workflow: on a pull request, a code change records
  # what it changes and a release is the bump those changes require,
  # published; on main, a published version is tagged and released. CI signs
  # nothing; the release was signed when the package publet was published.
  release:
    needs: ci
    uses: schryer/pubrel/.github/workflows/release.yml@v0.5.4
    with: { pubrel-version: v0.5.4, semver-checks-version: 0.51.0 }
    permissions:
      contents: write
