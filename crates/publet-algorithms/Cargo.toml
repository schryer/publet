[package]
name = "publet-algorithms"
description = "Generic algorithms publet is built on: an RFC 6962 Merkle log, sorted-set membership with absence proofs, recursive content trees, exact fixed-point arithmetic, and deterministic trust propagation. Depends on nothing publet-specific."
# Released on a version track of its own, not the workspace's.
version = "0.2.0"
edition.workspace = true
# The oldest Rust this crate builds on, tested in CI (`make msrv`): the first
# release with the 2024 edition. Not the workspace's, which is the toolchain
# publet itself is developed with.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/publet-algorithms"
keywords = ["merkle", "transparency-log", "pagerank", "fixed-point", "topological-sort"]
categories = ["algorithms", "data-structures", "cryptography"]
# Anchored with /: like gitignore patterns, a bare name matches at any depth.
include = ["/src/**/*.rs", "/tests/**/*.rs", "/testdata/*.json", "/README.md", "/CHANGELOG.md", "/LICENSE", "/SECURITY.md", "/SUPPLY-CHAIN.md", "/TESTING.md"]

[package.metadata.docs.rs]
# Link every item in the rendered source to its definition (docs.rs builds
# with nightly rustdoc, which has the flag).
rustdoc-args = ["--generate-link-to-definition"]
all-features = true

[dependencies]
sha2 = "0.10"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
proptest = "1"
ct-merkle = "0.3"
sha2_011 = { version = "0.11", package = "sha2" }
