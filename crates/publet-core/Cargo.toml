[package]
name = "publet-core"
description = "Objects, canonical CBOR, content identifiers, and signatures."
# Released on a version track of its own, not the workspace's.
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/publet-core"
readme = "README.md"
keywords = ["content-addressing", "cbor", "ed25519", "signatures", "publet"]
categories = ["cryptography", "encoding"]
include = ["src/**/*.rs", "tests/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
thiserror.workspace = true
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
unicode-normalization = "0.1"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
